name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # HDRIs are not committed; cache them between runs (keyed on the place list).
      - uses: actions/cache@v4
        with:
          path: public/hdri
          key: hdri-${{ hashFiles('src/data/places.json', 'scripts/fetch-hdris.mjs') }}
      - run: npm run typecheck
      - run: npm test
      # prebuild downloads missing HDRIs and fails on missing/forbidden credits.
      - run: npm run build
        env:
          NODE_ENV: production
