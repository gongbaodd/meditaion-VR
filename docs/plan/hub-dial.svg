<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 1240 840" width="1240" height="840" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans', sans-serif">
  <title>Hub dial with a rim handle — proposal</title>
  <defs>
    <radialGradient id="plate" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#2c3038"/>
      <stop offset="1" stop-color="#17191e"/>
    </radialGradient>
    <radialGradient id="cap" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#4a4f5b"/>
      <stop offset="1" stop-color="#2a2d35"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#d9ffe0"/>
      <stop offset="0.55" stop-color="#7fd08a"/>
      <stop offset="1" stop-color="#3f8a4c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fd08a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fd08a" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f1d9a8"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#8a90a0" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect x="-40" width="1240" height="840" fill="#0b0c0f"/>

  <text x="40" y="52" fill="#fafaf7" font-size="28" font-weight="700">Hub dial — rim handle</text>
  <text x="40" y="80" fill="#9ea3ab" font-size="16">Proposal. Grab the handle and drag it around the rim; no wrist twist.</text>

  <!-- ============ TOP VIEW (what you see looking down at the dial) ============ -->
  <text x="40" y="126" fill="#9ea3ab" font-size="13" font-weight="700" letter-spacing="2">TOP VIEW</text>

  <!-- fixed plate -->
  <circle cx="330" cy="410" r="225" fill="url(#plate)" stroke="#555a66" stroke-width="2"/>
  <!-- rim track the handle rides in -->
  <circle cx="330" cy="410" r="200" fill="none" stroke="#0b0c0f" stroke-width="30"/>
  <circle cx="330" cy="410" r="200" fill="none" stroke="#3a3e48" stroke-width="1.5" stroke-dasharray="2 7"/>

  <!-- six detents on the fixed plate, one per place, in the place colour -->
  <g stroke-linecap="round" stroke-width="7">
    <line x1="330" y1="198" x2="330" y2="182" stroke="#ff9d6c"/>
    <line x1="513.6" y1="304" x2="527.5" y2="296" stroke="#7fd08a"/>
    <line x1="513.6" y1="516" x2="527.5" y2="524" stroke="#6fc3d9"/>
    <line x1="330" y1="622" x2="330" y2="638" stroke="#ffc46b"/>
    <line x1="146.4" y1="516" x2="132.5" y2="524" stroke="#b9e36b"/>
    <line x1="146.4" y1="304" x2="132.5" y2="296" stroke="#7d8cff"/>
  </g>
  <g fill="#0b0c0f" stroke-width="3">
    <circle cx="330" cy="210" r="7" stroke="#ff9d6c"/>
    <circle cx="503.2" cy="510" r="7" stroke="#6fc3d9"/>
    <circle cx="330" cy="610" r="7" stroke="#ffc46b"/>
    <circle cx="156.8" cy="510" r="7" stroke="#b9e36b"/>
    <circle cx="156.8" cy="310" r="7" stroke="#7d8cff"/>
  </g>

  <!-- place names (annotation only; in VR the names stay under the windows) -->
  <g font-size="15" fill="#c9ccd2">
    <text x="330" y="166" text-anchor="middle">Mountain Dawn</text>
    <text x="548" y="290" fill="#7fd08a" font-weight="700">Forest Light</text>
    <text x="548" y="540">Lakeside</text>
    <text x="330" y="664" text-anchor="middle">Sunrise Shore</text>
    <text x="112" y="540" text-anchor="end">Alpine Meadow</text>
    <text x="112" y="290" text-anchor="end">Starry Night</text>
  </g>

  <!-- turning part: centre cap + arm + handle (drawn at Forest Light, 60°) -->
  <circle cx="330" cy="410" r="118" fill="url(#cap)" stroke="#6a7080" stroke-width="2"/>
  <circle cx="330" cy="410" r="96" fill="none" stroke="#1d2026" stroke-width="2"/>
  <line x1="330" y1="410" x2="503.2" y2="310" stroke="#8a90a0" stroke-width="12" stroke-linecap="round"/>
  <line x1="330" y1="410" x2="503.2" y2="310" stroke="#c4c9d6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="330" cy="410" r="20" fill="#8a90a0" stroke="#1d2026" stroke-width="2"/>

  <!-- drag path to the next place, and where the handle is heading -->
  <path d="M 524.5 365 A 200 200 0 0 1 527 445" fill="none" stroke="#f1d9a8" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)" transform="translate(34 0)"/>
  <circle cx="527" cy="444.7" r="26" fill="none" stroke="#c9ccd2" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>

  <!-- handle -->
  <circle cx="503.2" cy="310" r="58" fill="url(#halo)"/>
  <circle cx="503.2" cy="310" r="27" fill="url(#ball)" stroke="#eafff0" stroke-width="2"/>

  <!-- ray from the controller, locked onto the handle -->
  <line x1="612" y1="742" x2="507" y2="322" stroke="#eafff0" stroke-width="2" opacity="0.75"/>
  <circle cx="505" cy="316" r="5" fill="#ffffff"/>
  <g transform="translate(612 742) rotate(14)">
    <rect x="-13" y="0" width="26" height="46" rx="11" fill="#24272c" stroke="#8a90a0" stroke-width="2"/>
    <circle cx="0" cy="13" r="5" fill="#8a90a0"/>
  </g>
  <text x="640" y="760" fill="#9ea3ab" font-size="13">controller ray</text>
  <text x="640" y="778" fill="#9ea3ab" font-size="13">or pinching hand</text>

  <!-- callouts -->
  <g font-size="13" fill="#9ea3ab" stroke="#4a4e56" stroke-width="1">
    <line x1="492" y1="285" x2="470" y2="150"/>
    <line x1="262" y1="332" x2="150" y2="168"/>
  </g>
  <text x="420" y="142" fill="#eceef1" font-size="13">handle: glows in the front place's colour</text>
  <text x="20" y="160" fill="#eceef1" font-size="13" text-anchor="start">cap + arm turn together</text>

  <!-- ============ SIDE VIEW ============ -->
  <text x="760" y="126" fill="#9ea3ab" font-size="13" font-weight="700" letter-spacing="2">SIDE VIEW</text>

  <line x1="770" y1="560" x2="1160" y2="560" stroke="#3a3e48" stroke-width="2"/>
  <!-- foot + stand -->
  <rect x="890" y="552" width="100" height="8" rx="3" fill="#555a66"/>
  <rect x="936" y="300" width="8" height="254" fill="#555a66"/>
  <!-- head, tilted 35° toward the viewer (viewer on the right) -->
  <g transform="rotate(35 940 296)">
    <rect x="832" y="289" width="216" height="14" rx="5" fill="#2c3038" stroke="#555a66" stroke-width="2"/>
    <rect x="884" y="275" width="112" height="14" rx="4" fill="#4a4f5b" stroke="#6a7080" stroke-width="1.5"/>
    <rect x="852" y="283" width="90" height="6" rx="3" fill="#8a90a0"/>
    <rect x="848" y="258" width="8" height="30" rx="3" fill="#8a90a0"/>
    <circle cx="852" cy="248" r="14" fill="url(#ball)" stroke="#eafff0" stroke-width="1.5"/>
  </g>
  <!-- tilt arc -->
  <path d="M 1040 296 A 100 100 0 0 1 1021.9 353.4" fill="none" stroke="#8a90a0" stroke-width="1.5"/>
  <line x1="940" y1="296" x2="1060" y2="296" stroke="#8a90a0" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="1050" y="334" fill="#c9ccd2" font-size="14">35°</text>
  <!-- height -->
  <line x1="812" y1="556" x2="812" y2="300" stroke="#8a90a0" stroke-width="1.2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="800" y="434" fill="#c9ccd2" font-size="14" text-anchor="end" transform="rotate(-90 800 434)">0.80 m</text>
  <!-- viewer -->
  <g transform="translate(1120 232)" stroke="#c9ccd2" stroke-width="2" fill="none">
    <path d="M -22 0 Q 0 -16 22 0 Q 0 16 -22 0 z"/>
    <circle r="6" fill="#c9ccd2"/>
  </g>
  <text x="1120" y="204" fill="#9ea3ab" font-size="13" text-anchor="middle">you</text>
  <text x="770" y="150" fill="#c9ccd2" font-size="14">Plate Ø 20 cm (was a 12 cm knob)</text>
  <text x="770" y="170" fill="#c9ccd2" font-size="14">Handle Ø 3.5 cm, stands 3 cm above the rim</text>

  <!-- ============ HANDLE STATES ============ -->
  <text x="760" y="622" fill="#9ea3ab" font-size="13" font-weight="700" letter-spacing="2">HANDLE STATES</text>
  <g font-size="13" text-anchor="middle">
    <circle cx="810" cy="672" r="17" fill="#8a90a0" stroke="#c4c9d6" stroke-width="2"/>
    <text x="810" y="718" fill="#eceef1">idle</text>
    <text x="810" y="736" fill="#9ea3ab">grey</text>

    <circle cx="950" cy="672" r="30" fill="#f1d9a8" opacity="0.18"/>
    <circle cx="950" cy="672" r="20" fill="#e8eaf0" stroke="#f1d9a8" stroke-width="3"/>
    <text x="950" y="718" fill="#eceef1">pointed at</text>
    <text x="950" y="736" fill="#9ea3ab">grows, gold ring</text>

    <circle cx="1090" cy="672" r="36" fill="url(#halo)"/>
    <circle cx="1090" cy="672" r="20" fill="url(#ball)" stroke="#eafff0" stroke-width="2"/>
    <text x="1090" y="718" fill="#eceef1">held</text>
    <text x="1090" y="736" fill="#9ea3ab">place colour + halo</text>
  </g>

  <!-- ============ HOW IT BEHAVES ============ -->
  <g font-size="14" fill="#c9ccd2">
    <text x="40" y="722" fill="#9ea3ab" font-size="13" font-weight="700" letter-spacing="2">HOW IT BEHAVES</text>
    <text x="40" y="748">1. Point at the handle (or reach it), hold trigger / pinch.</text>
    <text x="40" y="770">2. Move around the rim. The handle follows your ray on the plate.</text>
    <text x="40" y="792">3. Each mark passed = next window in front, with a tick + pulse.</text>
    <text x="40" y="814">4. Let go: the handle settles on the nearest mark.</text>
  </g>
</svg>
